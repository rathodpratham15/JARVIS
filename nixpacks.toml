# Railway build configuration
# python3-saml requires libxmlsec1 for XML signature verification (SAML 2.0)

[phases.setup]
aptPkgs = [
    "libxmlsec1-dev",
    "pkg-config",
    "libssl-dev",
    "libffi-dev",
    "libgl1",
    "libglib2.0-0",
]

# insightface pulls in opencv-python (full) as a transitive dep which requires
# libxcb (not available headless). Force-remove it after install so only
# opencv-python-headless remains.
[phases.install]
cmds = [
    "pip install -r backend/requirements.txt",
    "pip uninstall -y opencv-python || true",
    "pip install opencv-python-headless>=4.8.0",
]
