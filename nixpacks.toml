# Railway build configuration
# python3-saml requires libxmlsec1 for XML signature verification (SAML 2.0)

[phases.setup]
aptPkgs = [
    "libxmlsec1-dev",
    "pkg-config",
    "libssl-dev",
    "libffi-dev",
    "libgl1",
    "libglib2.0-0",
    "libxcb1",
    "libxcb-shm0",
    "libxcb-icccm4",
    "libxcb-image0",
    "libxcb-keysyms1",
    "libxcb-render-util0",
    "libxcb-xinerama0",
    "libxcb-xfixes0",
]
